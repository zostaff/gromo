<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1600px;height:900px;overflow:hidden;font-family:-apple-system,"SF Pro Display",system-ui;background:#cdff00;position:relative}

.p1{left:740px;top:160px;transform:rotate(-6deg)}
